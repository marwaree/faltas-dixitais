[package]
name = "faltas-dixitais"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
nanoid = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
